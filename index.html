<head>

<style>
:root{--g:#0f766e;--g2:#14b8a6;--bg:#f4f7f6;--t:#1f2937;--m:#6b7280;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--t)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:24px;font-weight:800}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:13px;font-weight:700;color:var(--m);margin:10px 0 4px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:12px;font:inherit;font-size:16px;background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{text-decoration:none;text-align:center;display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:16px;margin-top:14px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.sec{background:#e6f4f1;color:var(--g)}.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.trip{display:flex;gap:12px}.times{min-width:52px;font-weight:800}.times small{display:block;color:var(--m);font-size:12px;font-weight:600}
.route{flex:1}.route b{display:block}.route span{color:var(--m);font-size:13px}
.price{font-weight:800;font-size:18px;color:var(--g);text-align:right}.price small{display:block;font-size:11px;color:var(--m);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--b);font-size:14px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;margin-right:8px;flex:none}
.drv{display:flex;align-items:center}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-left:6px}
.t-ok{background:#dcfce7;color:#15803d}.t-w{background:#fce7f3;color:#be185d}
.hint{font-size:13px;color:var(--m);margin-top:8px;line-height:1.45}.empty{text-align:center;color:var(--m);padding:28px 10px}
.note{background:#ecfdf5;border-left:4px solid var(--g2);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;line-height:1.45}
.warn{background:#fef3c7;border-left-color:#d97706}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--b);display:flex;padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font:inherit;font-size:12px;font-weight:700;color:var(--m);cursor:pointer;padding:6px 0}
nav button span{display:block;font-size:22px}nav button.on{color:var(--g)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 6px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;display:none;z-index:20;max-width:90%;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--b);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.msgs{max-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msg{padding:8px 12px;border-radius:14px;max-width:80%;font-size:15px;background:#f3f4f6;align-self:flex-start}.msg.me{background:var(--g);color:#fff;align-self:flex-end}
.dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;margin-left:4px}
nav button{position:relative}nav .dot{position:absolute;top:0;left:55%}
.new{background:#fef3c7;color:#b45309}
.roles{display:grid;gap:10px;margin:14px 0}.role{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--b);background:#fff;border-radius:16px;padding:14px;font:inherit;cursor:pointer}.role b{display:block;font-size:17px}.role span.e{font-size:30px}.role small{color:var(--m)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}.todo .ic{font-size:22px;width:30px;text-align:center}.todo .tx{flex:1}.todo .tx small{display:block;color:var(--m)}.todo.done .tx b{text-decoration:line-through;color:var(--m)}
.bar{height:10px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}.stars button{font-size:34px;background:none;border:0;cursor:pointer;filter:grayscale(1);opacity:.45}.stars button.on{filter:none;opacity:1}
.rate{color:#b45309;font-weight:800;font-size:13px;margin-left:4px}
.mode{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:4px;margin-top:14px;gap:4px}
.mode button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:9px 6px;border-radius:99px;cursor:pointer;position:relative}
.mode button.on{background:#fff;color:var(--g)}.mode .dot{position:absolute;top:2px;right:10px}
.msg small{display:block;font-size:11px;opacity:.7}h3{margin:4px 0 8px}
.legal h2{margin:0 0 8px}.legal h4{margin:16px 0 4px;color:var(--g)}.legal p,.legal li{font-size:14px;line-height:1.5}.legal ul{padding-left:18px;margin:4px 0}
</style>
</head>
<body>
<div class="app">
  <header><h1>🚗 Covoit' Andelys</h1><p>Covoiturage courte distance – Les Andelys &amp; alentours</p>
    <div class="mode"><button data-mode="passenger" onclick="setMode('passenger')">🧍 Passager<b class="dot" id="mdp" style="display:none"></b></button><button data-mode="driver" onclick="setMode('driver')">🚗 Conducteur<b class="dot" id="mdd" style="display:none"></b></button></div></header>
  <main id="view"><div class="empty">Chargement…</div></main>
</div>
<nav>
  <button data-tab="search" class="on"><span>🔎</span>Rechercher</button>
  <button data-tab="offer"><span>➕</span>Proposer</button>
  <button data-tab="mine"><span>🧾</span>Mes trajets<b class="dot" id="nbadge" style="display:none"></b></button>
  <button data-tab="profile"><span>👤</span>Profil</button>
</nav>
<div class="bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======== CONFIGURATION : colle ici tes 2 valeurs Supabase (Project Settings > API) ======== */
const SUPABASE_URL = 'https://ntqdmoeqeuoxojhdyrby.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LnPPU-93ttb-kneXOKWddQ_SfHCLsja';
const CONTACT_EMAIL = 'covoitandelys@gmail.com'; // e-mail affiché pour la vérification d'identité
/* =========================================================================================== */

const PLACES = {"Les Andelys":[49.246,1.411],"Vernon":[49.093,1.485],"Gare de Vernon-Giverny":[49.088,1.473],"Gaillon":[49.161,1.329],
 "Évreux":[49.024,1.151],"Louviers":[49.215,1.165],"Gisors":[49.281,1.776],"Étrépagny":[49.306,1.612],"Écouis":[49.312,1.444],
 "Lyons-la-Forêt":[49.399,1.476],"Val-de-Reuil":[49.274,1.210],"Pont-de-l'Arche":[49.303,1.155],"Rouen":[49.443,1.099],
 "Saint-Marcel":[49.098,1.448],"Le Val d'Hazey (Aubevoye)":[49.172,1.334],"Bouafles":[49.211,1.385],"Fleury-sur-Andelle":[49.362,1.354],
 "Port-Mort":[49.170,1.417],"Tosny":[49.230,1.358],"Muids":[49.226,1.293],"Corny":[49.270,1.469],"Heuqueville":[49.277,1.348],
 "Pacy-sur-Eure":[49.016,1.385],"Gasny":[49.093,1.604],"Vexin-sur-Epte (Écos)":[49.160,1.588],"Les Thilliers-en-Vexin":[49.231,1.594],
 "Courcelles-sur-Seine":[49.183,1.366],"Saint-Aubin-sur-Gaillon (aire A13)":[49.143,1.320],"Heudebouville (Écoparc)":[49.195,1.274],
 "Romilly-sur-Andelle":[49.333,1.267],"Charleval":[49.375,1.384],"Le Neubourg":[49.151,0.910],"Évreux – Gare":[49.019,1.141],
 "Bonnières-sur-Seine (78)":[49.035,1.578],"Mantes-la-Jolie (78)":[48.990,1.717],"Gare de Mantes-la-Jolie (78)":[48.989,1.703],
 "Magny-en-Vexin (95)":[49.155,1.786],"Elbeuf (76)":[49.287,1.008],"Incarville":[49.236,1.183],"Gare de Val-de-Reuil":[49.264,1.214]};
try{ Object.assign(PLACES, JSON.parse(localStorage.getItem('covoit_places')||'{}')); }catch(e){}
const NAMES = Object.keys(PLACES).sort((a,b)=>a.localeCompare(b,'fr'));
const DEPTS = ['27','76','78','95','60','28','14','61'];
const placeName = c => c.codeDepartement==='27' ? c.nom : `${c.nom} (${c.codeDepartement})`;
function rememberPlace(n, lat, lon){ PLACES[n]=[lat,lon]; try{ const m=JSON.parse(localStorage.getItem('covoit_places')||'{}'); m[n]=[lat,lon]; localStorage.setItem('covoit_places',JSON.stringify(m)); }catch(e){} }
async function geoSearch(q){
  q=q.replace(/\s*\(\d+\)\s*$/,'').trim(); if(q.length<2) return [];
  try{ const r=await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(q)}&fields=nom,codeDepartement,centre&boost=population&limit=25`);
    const list=(await r.json()).filter(c=>DEPTS.includes(c.codeDepartement)&&c.centre).slice(0,8);
    list.forEach(c=>rememberPlace(placeName(c), c.centre.coordinates[1], c.centre.coordinates[0])); return list.map(placeName);
  }catch(e){ return []; } }
// Trouve les coordonnées d'un nom tapé (liste connue, sinon recherche officielle)
async function resolvePlace(v){
  v=(v||'').trim(); if(!v) return '';
  if(PLACES[v]) return v;
  const k=Object.keys(PLACES).find(n=>n.toLowerCase()===v.toLowerCase()); if(k) return k;
  const found=await geoSearch(v); const exact=found.find(n=>n.toLowerCase().replace(/\s*\(\d+\)$/,'')===v.toLowerCase().replace(/\s*\(\d+\)$/,''));
  return exact || found[0] || null; }
// Champ de saisie d'une commune avec suggestions
const placeInput = (id, val, ph) => `<input id="${id}" list="dl_${id}" value="${esc(val||'')}" placeholder="${ph||'Tape une commune'}" autocomplete="off" autocapitalize="words"><datalist id="dl_${id}">${NAMES.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
function wirePlace(id, onPick){ const el=$('#'+id); if(!el) return; let tmr;
  el.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(async()=>{ const res=await geoSearch(el.value); if(!res.length) return;
    const dl=$('#dl_'+id); const have=new Set([...dl.options].map(o=>o.value)); res.forEach(n=>{ if(!have.has(n)){ const o=document.createElement('option'); o.value=n; dl.prepend(o);} }); },300); });
  el.addEventListener('change',async()=>{ if(!el.value.trim()){ onPick&&onPick(''); return; } const r=await resolvePlace(el.value);
    if(r){ el.value=r; onPick&&onPick(r); } else toast('Commune introuvable : choisis-la dans les suggestions'); }); }
const FUEL = 2.34, CONSO = 6, BAREME = 0.636, MAX_DAY = 4;
const COLORS = ['#0f766e','#7c3aed','#db2777','#ea580c','#2563eb','#16a34a'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n).toFixed(2).replace('.', ',') + ' €';
function km(a,b){if(!PLACES[a]||!PLACES[b]) return 0; const [la1,lo1]=PLACES[a],[la2,lo2]=PLACES[b],r=Math.PI/180;
 const d=2*6371*Math.asin(Math.sqrt(Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2));return Math.max(1,Math.round(d*1.3));}
const fuelCost = (a,b) => km(a,b)*CONSO/100*FUEL;
const MIN_PRICE = 1;
const suggested = (a,b,s) => Math.max(MIN_PRICE, Math.round(fuelCost(a,b)/(s+1)*2)/2);
const minPrice = (a,b,s) => Math.min(MIN_PRICE, maxPrice(a,b,s));
const maxPrice = (a,b,s) => Math.floor(km(a,b)*BAREME/(s+1)*2)/2;
const dur = k => Math.round(k*1.1+5);
const hm = d => d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function dayLabel(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const n=Math.round((x-t)/864e5);
 return n===0?"Aujourd'hui":n===1?'Demain':new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
function quickDepart(min){ const d=new Date(Date.now()+min*6e4); d.setMinutes(Math.ceil(d.getMinutes()/5)*5,0,0);
  $('#od').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); $('#oh').value=hm(d);
  $('#oi')?.classList.add('on'); document.querySelectorAll('.qd').forEach(b=>b.classList.toggle('on', +b.dataset.m===min));
  toast('Départ à '+hm(d)+' · réservation instantanée activée ⚡'); }
const soonText = d => { const m=Math.round((d-Date.now())/6e4); return m<=0?'Part maintenant':m<60?`Part dans ${m} min`:m<120?`Part dans 1 h ${String(m-60).padStart(2,'0')}`:''; };
const nextHour = () => String((new Date().getHours()+1)%24).padStart(2,'0')+':00';
const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const av = (n, url, sz) => { const st=sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.4)}px;`:''; return url ? `<img class="av" src="${esc(url)}" alt="" style="${st}object-fit:cover">` : `<span class="av" style="${st}background:${COLORS[(n||'?').charCodeAt(0)%COLORS.length]}">${esc((n||'?')[0].toUpperCase())}</span>`; };
const LUGGAGE = {none:'🚫 Pas de bagage', small:'🎒 Petit bagage', large:'🧳 Valise acceptée'};
const tripOpts = t => [LUGGAGE[t.luggage]||LUGGAGE.small, t.pets?'🐾 Animaux acceptés':'🐾 Pas d\'animaux', t.max2_back?'💺 Max 2 à l\'arrière':'', '🚭 Non-fumeur'].filter(Boolean).join(' · ');
const seatsText = (left,total) => left>0 ? `👥 ${left} place${left>1?'s':''} disponible${left>1?'s':''} sur ${total}` : `👥 Complet (${total} place${total>1?'s':''})`;
const badge = d => d?.verified ? '<span class="tag t-ok">✓ Vérifié</span>' : d?.stripe_ready ? '<span class="tag" style="background:#e0e7ff;color:#3730a3">🪪 Identité vérifiée</span>' : '';
const stars = d => d?.rating_count ? `<span class="rate">⭐ ${String(d.rating_avg).replace('.',',')} (${d.rating_count})</span>` : '';
const carText = d => [d?.car_model, d?.car_color].filter(Boolean).map(esc).join(' · ');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',Math.max(2600,m.length*60));}
const opts = (sel,blank) => (blank?`<option value="">${blank}</option>`:'')+NAMES.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
function sheet(html){$('#sheet').innerHTML=html;$('#bg').style.display='flex';}
function closeSheet(){const wasChat=!!chatTimer;$('#bg').style.display='none';clearInterval(chatTimer);chatTimer=null;if(wasChat&&tab==='mine')render();}
$('#bg').onclick = e => { if (e.target.id==='bg') closeSheet(); };
function errMsg(e){const m=(e&&e.message)||'';
 if(m.includes('places_ok'))return 'Plus assez de places sur ce trajet';
 if(m.includes('déjà une demande'))return 'Tu as déjà une demande sur ce trajet';
 if(m.includes('déjà parti'))return 'Ce trajet est déjà parti';
 if(m.includes('paypal_me'))return 'Identifiant PayPal invalide (lettres et chiffres uniquement)';
 if(m.includes('prix_plafond'))return 'Prix au-dessus du maximum légal';
 if(m.includes('Limite de 4'))return 'Limite de 4 trajets par jour atteinte';
 if(m.includes('déjà passée'))return 'La date du trajet est déjà passée';
 if(m.includes('Invalid login'))return 'E-mail ou mot de passe incorrect';
 if(m.includes('already registered'))return 'Un compte existe déjà avec cet e-mail';
 if(m.includes('Password should'))return 'Mot de passe trop court (6 caractères minimum)';
 if(m.includes('row-level security'))return 'Action non autorisée';
 return m || 'Erreur, réessaie';}

const configured = !SUPABASE_URL.startsWith('COLLE');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let notif = {new_bookings:0, unread:{}};
let mode = (()=>{try{return localStorage.getItem('covoit_mode')||'passenger'}catch(e){return 'passenger'}})();
let user = null, me = null, tab = mode==='driver' ? 'offer' : 'search', filter = {from:'', to:'', date:'', period:'7'}, chatTimer = null;

async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  user = session?.user || null;
  me = user ? (await sb.from('profiles').select('*').eq('id', user.id).single()).data : null;
}

async function refreshNotif(){
  if(!user){notif={new_bookings:0,unread:{}};}
  else{const {data}=await sb.rpc('my_notifications'); if(data) notif=data;}
  const n=(notif.new_bookings||0)+(notif.responses||0)+Object.values(notif.unread||{}).reduce((a,b)=>a+b,0);
  const el=$('#nbadge'); if(el){el.textContent=n>9?'9+':n; el.style.display=n?'inline-block':'none';}
  const dd=$('#mdd'), dp=$('#mdp'); if(dd){dd.textContent='';dd.style.display=(notif.new_bookings&&mode!=='driver')?'inline-block':'none';}
  if(dp){dp.textContent='';dp.style.display=(notif.responses&&mode!=='passenger')?'inline-block':'none';}
  return notif;
}
const STATUS = {pending:'<span class="tag new">⏳ En attente</span>', accepted:'<span class="tag t-ok">✅ Confirmé</span>', refused:'<span class="tag" style="background:#fee2e2;color:#b91c1c">❌ Refusé</span>'};
const payText = d => { const m=[]; if(d.stripe_ready) m.push('💳 carte bancaire (+ frais de service)'); if(d.paypal_me) m.push('PayPal'); if(d.accepts_cash!==false) m.push('💶 espèces au conducteur');
  return m.length ? 'Paiement accepté : '+m.join(' · ')+'.' : 'Règle ta part directement au conducteur.'; };
const payLink = (pp, amount) => `https://paypal.me/${encodeURIComponent(pp)}/${Number(amount).toFixed(2)}EUR`;
const unreadDot = bid => { const n=(notif.unread||{})[bid]; return n?`<b class="dot">${n}</b>`:''; };
function tripCard(t, actions){
  const k=t.km, d=new Date(t.depart_at), left=t.seats-t.booked, name=t.driver?.first_name||'Conducteur';
  return `<div class="card"><div class="trip">
   <div class="times">${hm(d)}<small>${hm(new Date(d.getTime()+dur(k)*6e4))}</small></div>
   <div class="route"><b>${esc(t.from_place)}</b><span>↓ ${k} km · ~${dur(k)} min</span><b>${esc(t.to_place)}</b></div>
   <div class="price">${eur(t.price)}<small>par place</small></div></div>
   <div class="hint">${carText(t.driver)?`🚗 ${carText(t.driver)} · `:''}${tripOpts(t)}</div>
   ${t.meeting_point?`<div class="hint">📍 RDV : ${esc(t.meeting_point)}</div>`:''}
   <div class="hint" style="font-weight:700;color:${left>0?'var(--g)':'#b91c1c'}">${seatsText(left,t.seats)}</div>
   ${t.note?`<div class="hint">💬 ${esc(t.note)}</div>`:''}
   <div class="meta"><div class="drv">${av(name, t.driver?.avatar_url)}<div>${esc(name)}${stars(t.driver)}${badge(t.driver)||(t.driver&&t.driver.first_name?'<span class="tag" style="background:#f3f4f6;color:#6b7280">Profil non vérifié</span>':'')}${t.women_only?'<span class="tag t-w">Entre femmes</span>':''}${soonText(d)?`<span class="tag new">⏱ ${soonText(d)}</span>`:''}<br><small style="color:var(--m)">${dayLabel(d)}</small></div></div>
   ${actions ?? (left>0?`<button class="btn small" onclick="openTrip('${t.id}')">Réserver</button>`:'<span style="color:var(--m)">Complet</span>')}</div></div>`;
}

let tripsCache = [];

  try{localStorage.setItem('covoit_mode',mode)}catch(e){}
  document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
  const nb=q=>document.querySelector(`nav button[data-tab="${q}"]`);

async function installApp(){
  if(installEvt){ installEvt.prompt(); const r=await installEvt.userChoice; installEvt=null; if(r.outcome==='accepted') toast('Appli installée 📲'); return; }
  sheet(`<h2>📲 Installer l'appli</h2>${isIOS()
    ? '<p>Sur <b>iPhone</b> (avec Safari) :</p><ol><li>Touche le bouton <b>Partager</b> ⬆️ en bas de l\'écran</li><li>Choisis <b>« Sur l\'écran d\'accueil »</b></li><li>Touche <b>Ajouter</b></li></ol><p>Ouvre ensuite l\'appli depuis l\'icône pour activer les notifications.</p>'
    : '<p>Sur <b>Android</b> (avec Chrome) :</p><ol><li>Touche les <b>3 points ⋮</b> en haut à droite</li><li>Choisis <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b></li></ol>'}
    <button class="btn sec" onclick="closeSheet()">Fermer</button>`);
}

/* ======== Alertes trajet ======== */
const SLOTS={tous:'À toute heure',matin:'Le matin (5h-10h)',midi:'En journée (10h-14h)',soir:'Le soir (14h-22h)'};
function openAlert(){
  if(!user) return go('profile');
  sheet(`<h2>🔔 Alerte trajet</h2><div class="hint">Tu reçois une notification et un e-mail dès qu'un trajet correspondant est publié.</div>
    <label>Départ</label>${placeInput('alf',filter.from||'Les Andelys','Partout')}
    <label>Arrivée</label>${placeInput('alt',filter.to||'','Partout')}
    <label>Horaire</label><select id="als">${Object.entries(SLOTS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <button class="btn" onclick="saveAlert(this)">Créer l'alerte</button><button class="btn sec" onclick="closeSheet()">Annuler</button>`);
  wirePlace('alf'); wirePlace('alt');
}
async function saveAlert(btn){ btn.disabled=true;
  const f=$('#alf').value.trim()?await resolvePlace($('#alf').value):'', t=$('#alt').value.trim()?await resolvePlace($('#alt').value):'';
  if(f===null||t===null){btn.disabled=false;return toast('Commune introuvable : choisis-la dans les suggestions');}
  const {error}=await sb.from('trip_alerts').insert({from_place:f||null,to_place:t||null,slot:$('#als').value});
  if(error){btn.disabled=false;return toast(errMsg(error));} closeSheet(); toast('Alerte créée 🔔'); if(tab==='profile') loadAlerts(); }
async function loadAlerts(){ const el=$('#alerts'); if(!el) return;
  const {data}=await sb.from('trip_alerts').select('*').order('created_at');
  el.innerHTML=(data||[]).map(a=>`<div class="meta"><span>${esc(a.from_place||'Partout')} → ${esc(a.to_place||'Partout')}<br><small class="hint">${SLOTS[a.slot]}</small></span><button class="btn small sec" onclick="delAlert(${a.id})">Supprimer</button></div>`).join('')||'<div class="hint">Aucune alerte. Crée-en une pour être prévenu des nouveaux trajets.</div>'; }
async function delAlert(id){ await sb.from('trip_alerts').delete().eq('id',id); loadAlerts(); }

/* ======== Avis ======== */
function openReview(bid, name){
  sheet(`<h2>⭐ Noter ${esc(name)}</h2><div class="hint">Ton avis aide toute la communauté. Il est visible par les membres.</div>
    <div class="stars" id="rst">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" onclick="[...this.parentNode.children].forEach(b=>b.classList.toggle('on',+b.dataset.n<=${n}));this.parentNode.dataset.v=${n}">⭐</button>`).join('')}</div>
    <label>Commentaire (facultatif)</label><textarea id="rcm" maxlength="300" rows="3" placeholder="Ponctuel, sympa, conduite agréable…"></textarea>
    <button class="btn" onclick="sendReview('${bid}',this)">Envoyer mon avis</button><button class="btn sec" onclick="closeSheet()">Plus tard</button>`);
}
async function sendReview(bid,btn){ const r=+($('#rst').dataset.v||0); if(!r) return toast('Choisis une note de 1 à 5 étoiles');
  btn.disabled=true; const {error}=await sb.rpc('leave_review',{b:bid,r,c:$('#rcm').value});
  if(error){btn.disabled=false;return toast(errMsg(error));} closeSheet(); toast('Merci pour ton avis ⭐'); render(); }

/* ======== Signalement ======== */
function reportUser(target, bid){
  sheet(`<h2>🚩 Signaler un problème</h2><div class="hint">Ton signalement est envoyé à l'équipe Covoit' Andelys, qui le traitera rapidement. En cas d'urgence, appelle le 17 ou le 112.</div>
    <label>Motif</label><select id="rpm"><option>Comportement inapproprié</option><option>Conduite dangereuse</option><option>Absent au rendez-vous</option><option>Demande d'argent en plus</option><option>Faux profil</option><option>Autre</option></select>
    <label>Explique en quelques mots</label><textarea id="rpt" maxlength="800" rows="4"></textarea>
    <button class="btn" onclick="sendReport(${target?`'${target}'`:'null'},${bid?`'${bid}'`:'null'},this)">Envoyer le signalement</button><button class="btn sec" onclick="closeSheet()">Annuler</button>`);
}
async function sendReport(target,bid,btn){ const reason=$('#rpm').value+' : '+$('#rpt').value.trim(); if($('#rpt').value.trim().length<3) return toast('Explique le problème en quelques mots');
  btn.disabled=true; const {error}=await sb.rpc('report_user',{p_target:target,p_booking:bid,p_reason:reason});
  if(error){btn.disabled=false;return toast(errMsg(error));} closeSheet(); toast('Signalement envoyé. Merci 🙏'); }
async function loadReports(){ const el=$('#rqueue'); if(!el) return; const {data,error}=await sb.rpc('admin_list_reports');
  if(error){el.innerHTML=`<div class="hint">${esc(errMsg(error))}</div>`;return;}
  el.innerHTML=(data||[]).map(r=>`<div class="meta"><span><b>${esc(r.reporter||'?')}</b> → <b>${esc(r.target||'?')}</b><br><small class="hint">${new Date(r.created_at).toLocaleString('fr-FR')}</small><br>${esc(r.reason)}</span><button class="btn small sec" onclick="closeReport(${r.id})">Traité</button></div>`).join('')||'<div class="hint">Aucun signalement en attente.</div>'; }
async function closeReport(id){ await sb.rpc('admin_close_report',{rid:id}); loadReports(); }


/* ======== Accueil des nouveaux membres & profil à compléter ======== */
const FB_URL = 'https://www.facebook.com/share/1FZ1LfJeSh/';
function openFB(){ try{ localStorage.setItem('covoit_fb','1'); }catch(e){} window.open(FB_URL,'_blank'); }
const fbDone = () => { try{ return localStorage.getItem('covoit_fb')==='1'; }catch(e){ return false; } };
const fbAsked = () => { try{ return !!localStorage.getItem('covoit_fb'); }catch(e){ return true; } };
const fbButton = () => `<button class="btn sec" style="background:#e7f0ff;color:#1d4ed8" onclick="openFB()">👍 Suis-nous sur Facebook</button>`;
const welcomeKey = () => 'covoit_welcome_' + (user?.id||'');
function maybeWelcome(){ try{ if(user && me && !localStorage.getItem(welcomeKey())) setTimeout(openWelcome, 600); }catch(e){} }
function openWelcome(){
  sheet(`<h2>Bienvenue ${esc(me?.first_name||'')} 👋</h2>
    <div class="hint">Covoit' Andelys, c'est le covoiturage du quotidien entre voisins. Tu l'utiliseras plutôt…</div>
    <div class="roles">
      <button class="role" onclick="welcomeRole('driver')"><span class="e">🚗</span><span><b>Comme conducteur</b><small>Je fais des trajets réguliers et je propose mes places libres</small></span></button>
      <button class="role" onclick="welcomeRole('passenger')"><span class="e">🧍</span><span><b>Comme passager</b><small>Je cherche une voiture pour mes déplacements</small></span></button>
      <button class="role" onclick="welcomeRole('both')"><span class="e">🔄</span><span><b>Les deux</b><small>Ça dépend des jours</small></span></button>
    </div><button class="link" onclick="welcomeRole(null)">Plus tard</button>`);
}
function welcomeRole(r){
  try{ localStorage.setItem(welcomeKey(), r||'later'); }catch(e){}
  if(!r){ closeSheet(); return; }
  try{ localStorage.setItem('covoit_role_'+user.id, r); }catch(e){}
  mode = r==='passenger' ? 'passenger' : 'driver'; try{localStorage.setItem('covoit_mode',mode)}catch(e){}
  openChecklist(r);
}
const myRole = () => { try{ return localStorage.getItem('covoit_role_'+user?.id) || (mode==='driver'?'driver':'passenger'); }catch(e){ return 'passenger'; } };
async function checklistItems(role){
  const notifOn = ('Notification' in window) && Notification.permission==='granted';
  const items=[];
  if(role!=='passenger'){
    const {count:nt} = await sb.from('trips').select('id',{count:'exact',head:true}).eq('driver_id',user.id);
    items.push(
      {ic:'🚗', t:'Ajouter mon véhicule', d:'Modèle et couleur : les passagers te reconnaissent', ok:!!me?.car_model, go:"closeSheet();go('profile');setTimeout(()=>$('#pcm')?.scrollIntoView({block:'center'}),400)"},
      {ic:'🔁', t:'Publier mon trajet habituel', d:'Un « trajet régulier » couvre toute la semaine en une fois', ok:(nt||0)>0, go:"closeSheet();setMode('driver')"},
      {ic:'🪪', t:'Obtenir le badge Vérifié', d:'Les passagers réservent plus volontiers. Documents supprimés après contrôle', ok:!!me?.verified, go:"closeSheet();go('profile');setTimeout(()=>$('#vcard')?.scrollIntoView({block:'center'}),600)"});
  }
  if(role!=='driver'){
    const {count:na} = await sb.from('trip_alerts').select('id',{count:'exact',head:true});
    items.push({ic:'🔔', t:'Créer une alerte trajet', d:'Sois prévenu dès qu\'un trajet correspond', ok:(na||0)>0, go:"closeSheet();openAlert()"});
  }
  items.push(
    {ic:'📷', t:'Ajouter une photo', d:'Facultatif, mais ça rassure', ok:!!me?.avatar_url, go:"closeSheet();go('profile')"},
    {ic:'📳', t:'Activer les notifications', d:'Demandes, réponses et messages en direct', ok:notifOn, go:"closeSheet();go('profile');setTimeout(enablePush,500)"},
    {ic:'📲', t:'Installer l\'appli', d:'Une icône sur ton écran d\'accueil', ok:isStandalone(), go:"closeSheet();installApp()"},
    {ic:'👍', t:'Suivre la page Facebook', d:'Nouveautés, trajets et entraide du coin', ok:fbDone(), go:"openFB();closeSheet()"});
  return items;
}
async function openChecklist(role){
  role = role || myRole();
  sheet('<h2>Pour bien démarrer</h2><div class="hint">Chargement…</div>');
  const items = await checklistItems(role); const done = items.filter(i=>i.ok).length;
  sheet(`<h2>${role==='passenger'?'🧍 Pour trouver un trajet':'🚗 Pour trouver des passagers'}</h2>
    <div class="hint">${done}/${items.length} étapes faites</div><div class="bar"><i style="width:${Math.round(done/items.length*100)}%"></i></div>
    ${items.map(i=>`<div class="todo ${i.ok?'done':''}"><span class="ic">${i.ok?'✅':i.ic}</span><span class="tx"><b>${i.t}</b><small>${i.d}</small></span>${i.ok?'':`<button class="btn small" onclick="${i.go}">Faire</button>`}</div>`).join('')}
    <button class="btn sec" style="margin-top:14px" onclick="closeSheet();render()">C'est noté</button>`);
}
async function loadProgress(){
  const el=$('#progress'); if(!el||!user) return;
  const items = await checklistItems(myRole()); const done=items.filter(i=>i.ok).length, pct=Math.round(done/items.length*100);
  if(pct===100){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="card"><h3>Ton profil est complété à ${pct} %</h3><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="hint">Plus ton profil est complet, plus tu trouveras ${myRole()==='passenger'?'facilement un trajet':'de passagers'}.</div>
    <button class="btn small" onclick="openChecklist()">Voir ce qu'il reste (${items.length-done})</button></div>`;
}


/* ======== Demande des passagers (alertes, anonyme) ======== */
let demandCache=[];
const SLOT_TXT={matin:'le matin',midi:'en journée',soir:'le soir',tous:'à toute heure'};
function demandFor(a,b){ return demandCache.filter(d=>(!d.from_place||d.from_place===a)&&(!d.to_place||d.to_place===b)).reduce((n,d)=>n+Number(d.n),0); }
function useDemand(i){ const d=demandCache[i]; if(!d) return;
  if(d.from_place){ $('#of').value=d.from_place; } if(d.to_place){ $('#ot').value=d.to_place; }
  $('#of').dispatchEvent(new Event('change')); $('#ot').dispatchEvent(new Event('change'));
  const h={matin:'07:30',midi:'12:00',soir:'17:30'}[d.slot]; if(h) $('#oh').value=h;
  $('#ot').scrollIntoView({block:'center'}); toast(d.to_place&&d.from_place?'Trajet prérempli : vérifie la date et l\'heure':'Complète l\'autre commune'); }
async function loadDemand(){
  const {data}=await sb.rpc('alert_demand'); demandCache=(data||[]).filter(d=>d.from_place||d.to_place);
  const el=$('#demand'); if(!el) return;
  const top=demandCache.slice(0,5); if(!top.length){ el.innerHTML=''; return; }
  const total=demandCache.reduce((n,d)=>n+Number(d.n),0);
  el.innerHTML=`<div class="card" style="border:2px solid var(--g)"><h3>🙋 Des passagers cherchent un conducteur</h3>
    <div class="hint">${total} alerte${total>1?'s':''} active${total>1?'s':''}. Publie l'un de ces trajets : ils seront prévenus aussitôt.</div>
    ${top.map((d,i)=>`<div class="meta"><span><b>${esc(d.from_place||'Partout')} → ${esc(d.to_place||'Partout')}</b><br><small class="hint">${SLOT_TXT[d.slot]||''} · ${d.n} passager${d.n>1?'s':''}</small></span><button class="btn small" onclick="useDemand(${i})">Proposer</button></div>`).join('')}</div>`;
}

async function logout(){await sb.auth.signOut();user=null;me=null;toast('Déconnecté');go('search');}

async function openChat(bid, other){
  sheet(`<h2>💬 ${esc(other||'Conversation')}</h2><div class="hint">Échangez ici le point de rendez-vous. Ne partagez pas d'informations sensibles.</div>
    <div class="msgs" id="msgs"><div class="hint">Chargement…</div></div>
    <div class="row"><input id="mtx" placeholder="Ton message" maxlength="1000"><button class="btn small" style="flex:none" id="msend">Envoyer</button></div>
    <button class="btn sec" onclick="closeSheet()">Fermer</button><button class="link" style="margin-top:6px" onclick="reportUser(null,'${bid}')">🚩 Signaler un problème</button>`);
  let lastMarked='';
  const load=async()=>{const [{data},{data:readAt}]=await Promise.all([sb.from('messages').select('*').eq('booking_id',bid).order('created_at'), sb.rpc('other_read_at',{b:bid})]);
    const box=$('#msgs'); if(!box)return; const atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<40;
    const msgs=data||[]; const lastMine=[...msgs].reverse().find(m=>m.sender_id===user.id);
    const seen = lastMine && readAt && new Date(readAt)>=new Date(lastMine.created_at);
    box.innerHTML=msgs.map(m=>`<div class="msg ${m.sender_id===user.id?'me':''}">${esc(m.body)}<small>${hm(new Date(m.created_at))}${m===lastMine?(seen?' · ✓✓ Lu':' · ✓ Envoyé'):''}</small></div>`).join('')||'<div class="hint">Aucun message. Dis bonjour 👋</div>';
    if(atEnd)box.scrollTop=box.scrollHeight;
    const lastIn=[...msgs].reverse().find(m=>m.sender_id!==user.id);
    if(lastIn && lastIn.created_at>lastMarked){ lastMarked=lastIn.created_at; await sb.rpc('mark_read',{b:bid}); refreshNotif(); }};
  const send=async()=>{const body=$('#mtx').value.trim();if(!body)return;$('#mtx').value='';
    const {error}=await sb.from('messages').insert({booking_id:bid,body});if(error)return toast(errMsg(error));load();};
  $('#msend').onclick=send; $('#mtx').onkeydown=e=>{if(e.key==='Enter')send();};
  await load(); $('#msgs').scrollTop=1e6; clearInterval(chatTimer); chatTimer=setInterval(load,4000);
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
(async()=>{ if(configured){ await loadMe(); sb.auth.onAuthStateChange(async(ev)=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){ await loadMe(); refreshNotif(); } }); await handleReturn(); refreshNotif(); setInterval(()=>{ if(!document.hidden) refreshNotif(); },20000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshNotif(); }); } render(); maybeWelcome(); })();
</script>
</body>
