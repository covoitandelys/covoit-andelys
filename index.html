<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Covoit' Andelys</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--bg:#f4f7f6;--t:#1f2937;--m:#6b7280;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--t)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:24px;font-weight:800}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:13px;font-weight:700;color:var(--m);margin:10px 0 4px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:12px;font:inherit;font-size:16px;background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{text-decoration:none;text-align:center;display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:16px;margin-top:14px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.sec{background:#e6f4f1;color:var(--g)}.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.trip{display:flex;gap:12px}.times{min-width:52px;font-weight:800}.times small{display:block;color:var(--m);font-size:12px;font-weight:600}
.route{flex:1}.route b{display:block}.route span{color:var(--m);font-size:13px}
.price{font-weight:800;font-size:18px;color:var(--g);text-align:right}.price small{display:block;font-size:11px;color:var(--m);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--b);font-size:14px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;margin-right:8px;flex:none}
.drv{display:flex;align-items:center}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-left:6px}
.t-ok{background:#dcfce7;color:#15803d}.t-w{background:#fce7f3;color:#be185d}
.hint{font-size:13px;color:var(--m);margin-top:8px;line-height:1.45}.empty{text-align:center;color:var(--m);padding:28px 10px}
.note{background:#ecfdf5;border-left:4px solid var(--g2);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;line-height:1.45}
.warn{background:#fef3c7;border-left-color:#d97706}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--b);display:flex;padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font:inherit;font-size:12px;font-weight:700;color:var(--m);cursor:pointer;padding:6px 0}
nav button span{display:block;font-size:22px}nav button.on{color:var(--g)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 6px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;display:none;z-index:20;max-width:90%;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--b);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.msgs{max-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msg{padding:8px 12px;border-radius:14px;max-width:80%;font-size:15px;background:#f3f4f6;align-self:flex-start}.msg.me{background:var(--g);color:#fff;align-self:flex-end}
.dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;margin-left:4px}
nav button{position:relative}nav .dot{position:absolute;top:0;left:55%}
.new{background:#fef3c7;color:#b45309}
.mode{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:4px;margin-top:14px;gap:4px}
.mode button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:9px 6px;border-radius:99px;cursor:pointer;position:relative}
.mode button.on{background:#fff;color:var(--g)}.mode .dot{position:absolute;top:2px;right:10px}
.msg small{display:block;font-size:11px;opacity:.7}h3{margin:4px 0 8px}
.legal h2{margin:0 0 8px}.legal h4{margin:16px 0 4px;color:var(--g)}.legal p,.legal li{font-size:14px;line-height:1.5}.legal ul{padding-left:18px;margin:4px 0}
</style>
</head>
<body>
<div class="app">
  <header><h1>🚗 Covoit' Andelys</h1><p>Covoiturage courte distance – Les Andelys &amp; alentours</p>
    <div class="mode"><button data-mode="passenger" onclick="setMode('passenger')">🧍 Passager<b class="dot" id="mdp" style="display:none"></b></button><button data-mode="driver" onclick="setMode('driver')">🚗 Conducteur<b class="dot" id="mdd" style="display:none"></b></button></div></header>
  <main id="view"><div class="empty">Chargement…</div></main>
</div>
<nav>
  <button data-tab="search" class="on"><span>🔎</span>Rechercher</button>
  <button data-tab="offer"><span>➕</span>Proposer</button>
  <button data-tab="mine"><span>🧾</span>Mes trajets<b class="dot" id="nbadge" style="display:none"></b></button>
  <button data-tab="profile"><span>👤</span>Profil</button>
</nav>
<div class="bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======== CONFIGURATION : colle ici tes 2 valeurs Supabase (Project Settings > API) ======== */
const SUPABASE_URL = 'https://ntqdmoeqeuoxojhdyrby.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LnPPU-93ttb-kneXOKWddQ_SfHCLsja';
const CONTACT_EMAIL = 'covoitandelys@gmail.com'; // e-mail affiché pour la vérification d'identité
/* =========================================================================================== */

const PLACES = {"Les Andelys":[49.246,1.411],"Vernon":[49.093,1.485],"Gare de Vernon-Giverny":[49.088,1.473],"Gaillon":[49.161,1.329],
 "Évreux":[49.024,1.151],"Louviers":[49.215,1.165],"Gisors":[49.281,1.776],"Étrépagny":[49.306,1.612],"Écouis":[49.312,1.444],
 "Lyons-la-Forêt":[49.399,1.476],"Val-de-Reuil":[49.274,1.210],"Pont-de-l'Arche":[49.303,1.155],"Rouen":[49.443,1.099],
 "Saint-Marcel":[49.098,1.448],"Le Val d'Hazey (Aubevoye)":[49.172,1.334],"Bouafles":[49.211,1.385],"Fleury-sur-Andelle":[49.362,1.354],
 "Port-Mort":[49.170,1.417],"Tosny":[49.230,1.358],"Muids":[49.226,1.293],"Corny":[49.270,1.469],"Heuqueville":[49.277,1.348],
 "Pacy-sur-Eure":[49.016,1.385],"Gasny":[49.093,1.604],"Vexin-sur-Epte (Écos)":[49.160,1.588],"Les Thilliers-en-Vexin":[49.231,1.594],
 "Courcelles-sur-Seine":[49.183,1.366],"Saint-Aubin-sur-Gaillon (aire A13)":[49.143,1.320],"Heudebouville (Écoparc)":[49.195,1.274],
 "Romilly-sur-Andelle":[49.333,1.267],"Charleval":[49.375,1.384],"Le Neubourg":[49.151,0.910],"Évreux – Gare":[49.019,1.141],
 "Bonnières-sur-Seine (78)":[49.035,1.578],"Mantes-la-Jolie (78)":[48.990,1.717],"Gare de Mantes-la-Jolie (78)":[48.989,1.703],
 "Magny-en-Vexin (95)":[49.155,1.786],"Elbeuf (76)":[49.287,1.008],"Incarville":[49.236,1.183],"Gare de Val-de-Reuil":[49.264,1.214]};
const NAMES = Object.keys(PLACES).sort((a,b)=>a.localeCompare(b,'fr'));
const FUEL = 2.34, CONSO = 6, BAREME = 0.636, MAX_DAY = 4;
const COLORS = ['#0f766e','#7c3aed','#db2777','#ea580c','#2563eb','#16a34a'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n).toFixed(2).replace('.', ',') + ' €';
function km(a,b){const [la1,lo1]=PLACES[a],[la2,lo2]=PLACES[b],r=Math.PI/180;
 const d=2*6371*Math.asin(Math.sqrt(Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2));return Math.max(1,Math.round(d*1.3));}
const fuelCost = (a,b) => km(a,b)*CONSO/100*FUEL;
const suggested = (a,b,s) => Math.max(0.5, Math.round(fuelCost(a,b)/(s+1)*2)/2);
const maxPrice = (a,b,s) => Math.floor(km(a,b)*BAREME/(s+1)*2)/2;
const dur = k => Math.round(k*1.1+5);
const hm = d => d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function dayLabel(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const n=Math.round((x-t)/864e5);
 return n===0?"Aujourd'hui":n===1?'Demain':new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
const nextHour = () => String((new Date().getHours()+1)%24).padStart(2,'0')+':00';
const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const av = (n, url, sz) => { const st=sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.4)}px;`:''; return url ? `<img class="av" src="${esc(url)}" alt="" style="${st}object-fit:cover">` : `<span class="av" style="${st}background:${COLORS[(n||'?').charCodeAt(0)%COLORS.length]}">${esc((n||'?')[0].toUpperCase())}</span>`; };
const LUGGAGE = {none:'🚫 Pas de bagage', small:'🎒 Petit bagage', large:'🧳 Valise acceptée'};
const tripOpts = t => [LUGGAGE[t.luggage]||LUGGAGE.small, t.pets?'🐾 Animaux acceptés':'🐾 Pas d\'animaux', t.max2_back?'💺 Max 2 à l\'arrière':'', '🚭 Non-fumeur'].filter(Boolean).join(' · ');
const seatsText = (left,total) => left>0 ? `👥 ${left} place${left>1?'s':''} disponible${left>1?'s':''} sur ${total}` : `👥 Complet (${total} place${total>1?'s':''})`;
const badge = d => d?.verified ? '<span class="tag t-ok">✓ Vérifié</span>' : d?.stripe_ready ? '<span class="tag" style="background:#e0e7ff;color:#3730a3">🪪 Identité vérifiée</span>' : '';
const carText = d => [d?.car_model, d?.car_color].filter(Boolean).map(esc).join(' · ');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',Math.max(2600,m.length*60));}
const opts = (sel,blank) => (blank?`<option value="">${blank}</option>`:'')+NAMES.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
function sheet(html){$('#sheet').innerHTML=html;$('#bg').style.display='flex';}
function closeSheet(){const wasChat=!!chatTimer;$('#bg').style.display='none';clearInterval(chatTimer);chatTimer=null;if(wasChat&&tab==='mine')render();}
$('#bg').onclick = e => { if (e.target.id==='bg') closeSheet(); };
function errMsg(e){const m=(e&&e.message)||'';
 if(m.includes('places_ok'))return 'Plus assez de places sur ce trajet';
 if(m.includes('déjà une demande'))return 'Tu as déjà une demande sur ce trajet';
 if(m.includes('déjà parti'))return 'Ce trajet est déjà parti';
 if(m.includes('paypal_me'))return 'Identifiant PayPal invalide (lettres et chiffres uniquement)';
 if(m.includes('prix_plafond'))return 'Prix au-dessus du maximum légal';
 if(m.includes('Limite de 4'))return 'Limite de 4 trajets par jour atteinte';
 if(m.includes('déjà passée'))return 'La date du trajet est déjà passée';
 if(m.includes('Invalid login'))return 'E-mail ou mot de passe incorrect';
 if(m.includes('already registered'))return 'Un compte existe déjà avec cet e-mail';
 if(m.includes('Password should'))return 'Mot de passe trop court (6 caractères minimum)';
 if(m.includes('row-level security'))return 'Action non autorisée';
 return m || 'Erreur, réessaie';}

const configured = !SUPABASE_URL.startsWith('COLLE');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let notif = {new_bookings:0, unread:{}};
let mode = (()=>{try{return localStorage.getItem('covoit_mode')||'passenger'}catch(e){return 'passenger'}})();
let user = null, me = null, tab = mode==='driver' ? 'offer' : 'search', filter = {from:'Les Andelys', to:'', date:''}, chatTimer = null;

async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  user = session?.user || null;
  me = user ? (await sb.from('profiles').select('*').eq('id', user.id).single()).data : null;
}

async function refreshNotif(){
  if(!user){notif={new_bookings:0,unread:{}};}
  else{const {data}=await sb.rpc('my_notifications'); if(data) notif=data;}
  const n=(notif.new_bookings||0)+(notif.responses||0)+Object.values(notif.unread||{}).reduce((a,b)=>a+b,0);
  const el=$('#nbadge'); if(el){el.textContent=n>9?'9+':n; el.style.display=n?'inline-block':'none';}
  const dd=$('#mdd'), dp=$('#mdp'); if(dd){dd.textContent='';dd.style.display=(notif.new_bookings&&mode!=='driver')?'inline-block':'none';}
  if(dp){dp.textContent='';dp.style.display=(notif.responses&&mode!=='passenger')?'inline-block':'none';}
  return notif;
}
const STATUS = {pending:'<span class="tag new">⏳ En attente</span>', accepted:'<span class="tag t-ok">✅ Confirmé</span>', refused:'<span class="tag" style="background:#fee2e2;color:#b91c1c">❌ Refusé</span>'};
const payText = d => { const m=[]; if(d.stripe_ready) m.push('💳 carte bancaire (+ frais de service)'); if(d.paypal_me) m.push('PayPal'); if(d.accepts_cash!==false) m.push('💶 espèces au conducteur');
  return m.length ? 'Paiement accepté : '+m.join(' · ')+'.' : 'Règle ta part directement au conducteur.'; };
const payLink = (pp, amount) => `https://paypal.me/${encodeURIComponent(pp)}/${Number(amount).toFixed(2)}EUR`;
const unreadDot = bid => { const n=(notif.unread||{})[bid]; return n?`<b class="dot">${n}</b>`:''; };
function tripCard(t, actions){
  const k=t.km, d=new Date(t.depart_at), left=t.seats-t.booked, name=t.driver?.first_name||'Conducteur';
  return `<div class="card"><div class="trip">
   <div class="times">${hm(d)}<small>${hm(new Date(d.getTime()+dur(k)*6e4))}</small></div>
   <div class="route"><b>${esc(t.from_place)}</b><span>↓ ${k} km · ~${dur(k)} min</span><b>${esc(t.to_place)}</b></div>
   <div class="price">${eur(t.price)}<small>par place</small></div></div>
   <div class="hint">${carText(t.driver)?`🚗 ${carText(t.driver)} · `:''}${tripOpts(t)}</div>
   ${t.meeting_point?`<div class="hint">📍 RDV : ${esc(t.meeting_point)}</div>`:''}
   <div class="hint" style="font-weight:700;color:${left>0?'var(--g)':'#b91c1c'}">${seatsText(left,t.seats)}</div>
   ${t.note?`<div class="hint">💬 ${esc(t.note)}</div>`:''}
   <div class="meta"><div class="drv">${av(name, t.driver?.avatar_url)}<div>${esc(name)}${badge(t.driver)}${t.women_only?'<span class="tag t-w">Entre femmes</span>':''}<br><small style="color:var(--m)">${dayLabel(d)}</small></div></div>
   ${actions ?? (left>0?`<button class="btn small" onclick="openTrip('${t.id}')">Réserver</button>`:'<span style="color:var(--m)">Complet</span>')}</div></div>`;
}

let tripsCache = [];
function setMode(m){ mode=m; try{localStorage.setItem('covoit_mode',m)}catch(e){}
  go(m==='driver' ? 'offer' : 'search'); }
function applyMode(){
  if(tab==='search') mode='passenger'; else if(tab==='offer') mode='driver';
  try{localStorage.setItem('covoit_mode',mode)}catch(e){}
  document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
  const nb=q=>document.querySelector(`nav button[data-tab="${q}"]`);
  nb('search').style.display = mode==='passenger' ? '' : 'none';
  nb('offer').style.display = mode==='driver' ? '' : 'none';
  nb('mine').childNodes[1].textContent = mode==='driver' ? 'Mes trajets' : 'Mes réservations';
}
async function render(){
  applyMode();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  const v = $('#view');
  if (!configured){ v.innerHTML = `<div class="card"><h3>Configuration manquante</h3><div class="hint">Colle l'adresse et la clé de ton projet Supabase en haut du fichier <b>index.html</b> (lignes « COLLE_ICI »).</div></div>`; return; }

  if (tab==='search'){
    v.innerHTML = `<div class="card"><h3>Où allez-vous ?</h3>
     <label>Départ</label><select id="ff">${opts(filter.from,'Partout')}</select>
     <button class="link" onclick="[filter.from,filter.to]=[filter.to,filter.from];render()">⇅ Inverser</button>
     <label style="margin-top:0">Arrivée</label><select id="ft">${opts(filter.to,'Partout')}</select>
     <label>Date</label><input type="date" id="fd" value="${filter.date}" min="${today()}">
     <div class="chips"><button class="chip${filter.women?' on':''}" onclick="filter.women=!filter.women;render()">♀ Trajets entre femmes</button><button class="chip${filter.verified?' on':''}" onclick="filter.verified=!filter.verified;render()">✓ Conducteurs vérifiés</button><button class="chip" onclick="filter={from:'',to:'',date:''};render()">Tout afficher</button></div></div>
     <div id="list"><div class="empty">Chargement des trajets…</div></div>`;
    ['ff','ft','fd'].forEach(id=>$('#'+id).onchange=()=>{filter={...filter,from:$('#ff').value,to:$('#ft').value,date:$('#fd').value};render();});
    let q = sb.from('trips').select('*, driver:profiles!trips_driver_id_fkey(first_name,verified,paypal_me,accepts_cash,stripe_ready,car_model,car_color,avatar_url,bio)').gte('depart_at', new Date(Date.now()-15*6e4).toISOString()).order('depart_at').limit(100);
    if (filter.from) q = q.eq('from_place', filter.from);
    if (filter.to) q = q.eq('to_place', filter.to);
    if (filter.date){ const s=new Date(filter.date+'T00:00'); q = q.gte('depart_at', s.toISOString()).lt('depart_at', new Date(s.getTime()+864e5).toISOString()); }
    if (filter.women) q = q.eq('women_only', true);
    let { data, error } = await q;
    if (!error && filter.verified) data = data.filter(t=>t.driver?.verified);
    if (error){ $('#list').innerHTML = `<div class="empty">Erreur de chargement : ${esc(error.message)}</div>`; return; }
    tripsCache = data;
    $('#list').innerHTML = `<h3 style="margin:16px 4px 8px">${data.length} trajet${data.length>1?'s':''}</h3>` +
      (data.map(t=>tripCard(t, user && t.driver_id===user.id ? '<span style="color:var(--m)">Ton trajet</span>' : undefined)).join('') ||
       `<div class="empty">Aucun trajet pour l'instant.<br><br><button class="btn sec" onclick="go('offer')">Proposer un trajet</button></div>`);
  }

  if (tab==='offer'){
    if (!user) return needLogin(v, 'proposer un trajet');
    v.innerHTML = `<div class="card"><h3>Proposer un trajet</h3>
     <label>Départ</label><select id="of">${opts('Les Andelys')}</select>
     <label>Arrivée</label><select id="ot">${opts('Gare de Vernon-Giverny')}</select>
     <div class="row"><div><label>Date</label><input type="date" id="od" value="${today()}" min="${today()}"></div>
     <div><label>Heure</label><input type="time" id="oh" value="${nextHour()}"></div></div>
     <div class="row"><div><label>Places</label><select id="os">${[1,2,3,4].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></div>
     <div><label>Prix / place (€)</label><input type="number" id="op" step="0.5" min="0" inputmode="decimal"></div></div>
     <div class="hint" id="oh2"></div>
     <label>Message (facultatif)</label><input id="on" maxlength="200" placeholder="Ex : départ place Nicolas Poussin">
     <label>Bagages</label><select id="olg"><option value="none">🚫 Pas de bagage</option><option value="small" selected>🎒 Petit bagage (sac, cabas)</option><option value="large">🧳 Valise acceptée</option></select>
     <label>Point de rendez-vous précis (facultatif)</label><input id="omp" maxlength="120" placeholder="Ex : parking de la mairie, devant la pharmacie">
     <div class="chips"><button class="chip" id="opt" onclick="this.classList.toggle('on')">🐾 Animaux acceptés</button><button class="chip" id="om2" onclick="this.classList.toggle('on')">💺 Max 2 à l'arrière</button>

     ${t.driver?.bio?`<div class="hint" style="font-style:italic">« ${esc(t.driver.bio)} »</div>`:''}
     <div class="hint">${carText(t.driver)?`🚗 ${carText(t.driver)}<br>`:''}${tripOpts(t).split(' · ').join('<br>')}${carText(t.driver)?'<br><small>La plaque te sera montrée une fois ta demande acceptée.</small>':''}</div>
     ${t.meeting_point?`<div class="hint">📍 Rendez-vous : <b>${esc(t.meeting_point)}</b></div>`:''}${t.note?`<div class="hint">💬 ${esc(t.note)}</div>`:''}</div>
    <label>Nombre de places</label><select id="bn">${Array.from({length:left},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
    <label>👶 Dont enfants voyageant avec toi</label><select id="bk"><option value="0">Aucun</option></select>
    <div class="hint" id="bkh" style="display:none">Un enfant voyage toujours <b>accompagné d'un adulte</b>. Pense à apporter le <b>siège auto ou rehausseur</b> adapté (obligatoire pour les moins de 10 ans).</div>
    <div class="note" id="btot"></div>
    <button class="btn" id="bgo" onclick="book('${id}')">${t.instant?'⚡ Réserver':'Demander une place'}</button><button class="btn sec" onclick="closeSheet()">Fermer</button>`);
  const tot=()=>$('#btot').innerHTML=`Total : <b>${eur(t.price*$('#bn').value)}</b>, à régler au conducteur.<br>${payText(t.driver||{})}${t.instant?'':'<br>Le conducteur doit accepter ta demande.'}`;
  const kids=()=>{const n=+$('#bn').value, k=$('#bk'), cur=Math.min(+k.value||0,n-1);
    k.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i}" ${i===cur?'selected':''}>${i?i+' enfant'+(i>1?'s':''):'Aucun'}</option>`).join('');
    $('#bkh').style.display=cur?'':'none';};
  $('#bk').onchange=()=>{$('#bkh').style.display=+$('#bk').value?'':'none';};
  $('#bn').onchange=()=>{tot();kids();}; tot(); kids();
  sb.rpc('driver_stats',{d:t.driver_id}).then(({data})=>{ const el=$('#dstats'); if(!el||!data) return;
    const since=data.since?new Date(data.since).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):'';
    el.textContent=`Membre depuis ${since} · ${data.trips} trajet${data.trips>1?'s':''} effectué${data.trips>1?'s':''} · ${data.passengers} passager${data.passengers>1?'s':''}`; });
}
let bookInstant=false;
async function book(id){$('#bgo').disabled=true;const {error}=await sb.from('bookings').insert({trip_id:id,seats:+$('#bn').value,children:+($('#bk')?.value||0)});
  if(error){$('#bgo').disabled=false;return toast(errMsg(error));} closeSheet(); toast(bookInstant?'Place réservée ✅':'Demande envoyée ⏳ Le conducteur va te répondre'); go('mine');}
async function respond(id, ok){const {error}=await sb.rpc('respond_booking',{b:id,accept:ok}); if(error)return toast(errMsg(error)); toast(ok?'Passager accepté ✅':'Demande refusée'); render();}
async function cancelB(id){const {error}=await sb.from('bookings').delete().eq('id',id); if(error)return toast(errMsg(error)); toast('Réservation annulée'); render();}
async function delTrip(id){const {error}=await sb.from('trips').delete().eq('id',id); if(error)return toast(errMsg(error)); toast('Trajet supprimé'); render();}
async function publish(){
  const a=$('#of').value,b=$('#ot').value,s=+$('#os').value,price=Math.max(0,+$('#op').value||0);
  if(a===b)return toast('Départ et arrivée identiques');
  if(price>maxPrice(a,b,s))return toast('Maximum légal : '+eur(maxPrice(a,b,s))+' par passager');
  const depart=new Date(`${$('#od').value}T${$('#oh').value}`);
  $('#pub').disabled=true;
  const {error}=await sb.from('trips').insert({from_place:a,to_place:b,depart_at:depart.toISOString(),seats:s,km:km(a,b),price,
    note:$('#on').value.trim(),women_only:$('#ow').classList.contains('on'),instant:$('#oi').classList.contains('on'),luggage:$('#olg').value,
    pets:$('#opt').classList.contains('on'),max2_back:$('#om2').classList.contains('on'),meeting_point:$('#omp').value.trim()});
  $('#pub').disabled=false; if(error)return toast(errMsg(error)); toast('Trajet publié 🚗'); go('mine');
}
async function callFn(body){
  const {data,error}=await sb.functions.invoke('stripe-v2',{body});
  if(error){ let m=error.message; try{ const j=await error.context.json(); if(j?.error) m=j.error; }catch(e){} throw new Error(m); }
  if(data?.error) throw new Error(data.error); return data;
}
async function stripeOnboard(){ const b=$('#stbtn'); b.disabled=true; b.textContent='Ouverture de Stripe…';
  try{ const r=await callFn({action:'onboard'}); if(r.ready){ me.stripe_ready=true; toast('Paiement par carte activé ✅'); render(); } else location.href=r.url; }
  catch(e){ b.disabled=false; b.textContent='Activer le paiement par carte'; toast(e.message); } }
async function payCard(bid, btn){ btn.disabled=true; btn.textContent='…';
  try{ const r=await callFn({action:'checkout', booking_id:bid}); location.href=r.url; }
  catch(e){ btn.disabled=false; btn.textContent='💳 Carte'; toast(e.message); } }
async function handleReturn(){
  const q=new URLSearchParams(location.search); if(!user) return;
  const clean=()=>history.replaceState(null,'',location.pathname);
  if(q.get('stripe')){ clean(); try{ const r=await callFn({action:'status'}); await loadMe();
      toast(r.ready?'Paiement par carte activé ✅':'Inscription Stripe incomplète : reprends-la depuis ton profil'); }catch(e){ toast(e.message); } tab='profile'; }
  else if(q.get('paid')){ const sid=q.get('paid'); clean(); try{ const r=await callFn({action:'confirm', session_id:sid});
      toast(r.paid?'Paiement réussi ✅ Merci !':'Paiement non confirmé'); }catch(e){ toast(e.message); } tab='mine'; mode='passenger'; }
  else if(q.get('paycancel')){ clean(); toast('Paiement annulé'); tab='mine'; mode='passenger'; }
}
async function saveName(){const fn=$('#pfn').value.trim();if(!fn)return;
  let pp=$('#ppp').value.trim().replace(/\/+$/,'').split('/').pop().replace(/^@/,'')||null;
  if(pp && !/^[A-Za-z0-9]{1,30}$/.test(pp)) return toast('Identifiant PayPal invalide (lettres et chiffres uniquement)');
  const plate=$('#pcp').value.toUpperCase().replace(/[^A-Z0-9 -]/g,'').trim()||null;
  if(plate && !/^[A-Z0-9 -]{4,12}$/.test(plate)) return toast('Plaque invalide (ex : AB-123-CD)');
  const car_model=$('#pcm').value.trim()||null, car_color=$('#pcc').value.trim()||null, bio=$('#pbio').value.trim()||null;
  const cash=$('#pcash').checked; const {error}=await sb.from('profiles').update({first_name:fn,paypal_me:pp,accepts_cash:cash,car_model,car_color,bio}).eq('id',user.id);
  if(error)return toast(errMsg(error));
  const r2=await sb.from('driver_private').upsert({user_id:user.id,car_plate:plate}); if(r2.error)return toast(errMsg(r2.error));
  Object.assign(me,{first_name:fn,paypal_me:pp,accepts_cash:cash,car_model,car_color,bio});$('#ppp').value=pp||'';$('#pcp').value=plate||'';toast('Profil enregistré');}
function resizeImage(file, size=320){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(img.width,img.height);c.width=c.height=size;
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);c.toBlob(b=>b?res(b):rej(new Error('Image illisible')),'image/jpeg',0.85);URL.revokeObjectURL(img.src);};
  img.onerror=()=>rej(new Error('Image illisible'));img.src=URL.createObjectURL(file);});}
async function uploadAvatar(file){ try{ toast('Envoi de la photo…'); const blob=await resizeImage(file); const path=`${user.id}/avatar.jpg`;
  const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'}); if(up.error) throw up.error;
  const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
  const {error}=await sb.from('profiles').update({avatar_url:url}).eq('id',user.id); if(error) throw error; me.avatar_url=url; toast('Photo enregistrée ✅'); render(); }
  catch(e){ toast(e.message||'Erreur photo'); } }
async function removeAvatar(){ await sb.storage.from('avatars').remove([`${user.id}/avatar.jpg`]); await sb.from('profiles').update({avatar_url:null}).eq('id',user.id); me.avatar_url=null; toast('Photo retirée'); render(); }
const VDOCS = [['id','🪪 Pièce d\'identité (recto)'],['permis','🚗 Permis de conduire'],['assurance','📄 Attestation d\'assurance du véhicule']];
async function loadVerifCard(){
  const box=$('#vcard'); if(!box) return;
  const {data:req}=await sb.from('verif_requests').select('*').eq('user_id',user.id).maybeSingle();
  const stripeLine = me?.stripe_ready ? '<div class="note">🪪 Ton identité a déjà été vérifiée par Stripe (paiement par carte) : le badge « Identité vérifiée » s\'affiche sur tes trajets.</div>' : '';
  let body;
  if(me?.verified) body='<div class="note">✅ Compte vérifié : le badge <b>✓ Vérifié</b> apparaît sur tes trajets.</div>';
  else if(req?.status==='pending') body=`${stripeLine}<div class="note warn">⏳ Demande envoyée le ${new Date(req.created_at).toLocaleDateString('fr-FR')}. Elle est en cours d'examen : la réponse s'affichera ici.</div>`;
  else body=`${stripeLine}${req?.status==='refused'?`<div class="note warn">❌ Demande refusée${req.reason?` : <b>${esc(req.reason)}</b>`:''}. Tu peux renvoyer tes documents.</div>`:''}
    <div class="hint">Le badge <b>✓ Vérifié</b> rassure les passagers. Envoie une photo nette de ces 3 documents :</div>
    ${VDOCS.map(([k,l])=>`<label style="color:var(--t)">${l}</label><input type="file" id="vd-${k}" accept="image/*">`).join('')}
    <div class="hint">🔒 Tes documents sont stockés dans un espace privé, visible uniquement par l'équipe Covoit' Andelys, et <b>supprimés dès l'examen terminé</b>.</div>
    <button class="btn" id="vsend" onclick="submitVerif()">Envoyer ma demande</button>`;
  box.innerHTML='<h3>🪪 Badge ✓ Vérifié</h3>'+body;
}
function resizeMax(file, max=1600){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('Image illisible')),'image/jpeg',0.85);URL.revokeObjectURL(img.src);};
  img.onerror=()=>rej(new Error('Image illisible'));img.src=URL.createObjectURL(file);});}
async function submitVerif(){
  const files=VDOCS.map(([k])=>$('#vd-'+k).files[0]); if(files.some(f=>!f)) return toast('Ajoute les 3 documents');
  const btn=$('#vsend'); btn.disabled=true; btn.textContent='Envoi en cours…';
  try{ const ts=Date.now(), paths=[];
    for(let i=0;i<3;i++){ const blob=await resizeMax(files[i]); const path=`${user.id}/${VDOCS[i][0]}-${ts}.jpg`;
      const up=await sb.storage.from('verif-docs').upload(path,blob,{contentType:'image/jpeg'}); if(up.error) throw up.error; paths.push(path); }
    const {error}=await sb.rpc('submit_verification',{paths}); if(error) throw error;
    toast('Demande envoyée ✅ La réponse s\'affichera dans ton profil'); loadVerifCard();
  }catch(e){ btn.disabled=false; btn.textContent='Envoyer ma demande'; toast(errMsg(e)); }
}
async function loadVerifQueue(){
  const box=$('#vqueue'); if(!box) return;
  const {data,error}=await sb.rpc('admin_list_verifs'); if(error){ box.innerHTML=`<div class="hint">${esc(errMsg(error))}</div>`; return; }
  if(!data?.length){ box.innerHTML='<div class="hint">Aucune demande en attente ✅</div>'; return; }
  const urls={}; const all=data.flatMap(r=>r.files||[]);
  if(all.length){ const {data:su}=await sb.storage.from('verif-docs').createSignedUrls(all,600); (su||[]).forEach(x=>urls[x.path]=x.signedUrl); }
  box.innerHTML=`<div class="hint"><b>${data.length} demande${data.length>1?'s':''} en attente</b></div>`+data.map(r=>`<div class="card" style="box-shadow:none;border:1px solid var(--b)">
    <b>${esc(r.first_name||'—')}</b>${r.stripe_ready?' <span class="tag" style="background:#e0e7ff;color:#3730a3">🪪 Stripe</span>':''}<br><small style="color:var(--m)">${esc(r.email||'')} · ${new Date(r.requested).toLocaleDateString('fr-FR')}</small>
    <div style="display:flex;gap:6px;margin-top:8px">${(r.files||[]).map((f,i)=>`<a href="${esc(urls[f]||'#')}" target="_blank" rel="noopener" style="flex:1;text-align:center;font-size:11px;color:var(--m)"><img src="${esc(urls[f]||'')}" style="width:100%;height:70px;object-fit:cover;border-radius:8px;background:#eee"><br>${['Identité','Permis','Assurance'][i]||''}</a>`).join('')}</div>
    <input id="vr-${r.uid}" placeholder="Motif si refus (ex : permis illisible)" style="margin-top:8px">
    <div class="row" style="margin-top:8px"><button class="btn small" onclick="reviewVerif('${r.uid}',true,this)">✓ Valider</button><button class="btn small sec" onclick="reviewVerif('${r.uid}',false,this)">✗ Refuser</button></div></div>`).join('')
    +'<div class="hint">Touche une photo pour l\'agrandir. Les documents sont supprimés dès ta réponse.</div>';
}
async function reviewVerif(uid,ok,btn){
  const why=($('#vr-'+uid)?.value||'').trim(); if(!ok && !why) return toast('Indique le motif du refus');
  btn.disabled=true; const {data:files,error}=await sb.rpc('admin_review_verif',{target:uid,accept:ok,why});
  if(error){ btn.disabled=false; return toast(errMsg(error)); }
  if(files?.length) await sb.storage.from('verif-docs').remove(files);
  const u=(openAdmin._data||[]).find(x=>x.uid===uid); if(u) u.verified=ok; if(uid===user.id) me.verified=ok;
  toast(ok?'Membre vérifié ✅ Documents supprimés':'Demande refusée, documents supprimés'); loadVerifQueue(); $('#aq')?.oninput?.();
}
async function openAdmin(){
  sheet('<h2>🛠️ Administration</h2><h3>Demandes de badge</h3><div id="vqueue"><div class="hint">Chargement…</div></div><h3 style="margin-top:16px">Tous les membres</h3><input id="aq" placeholder="Rechercher un prénom ou un e-mail"><div id="alist"><div class="hint">Chargement…</div></div><button class="btn sec" onclick="closeSheet()">Fermer</button>');
  const {data,error}=await sb.rpc('admin_list_users'); if(error){ $('#alist').innerHTML=`<div class="hint">${esc(errMsg(error))}</div>`; return; }
  const draw=()=>{ const q=($('#aq').value||'').toLowerCase(); const rows=(data||[]).filter(u=>!q||(u.first_name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q));
    $('#alist').innerHTML=`<div class="hint">${rows.length} membre${rows.length>1?'s':''}</div>`+rows.map(u=>`<div class="meta"><span style="display:flex;align-items:center">${av(u.first_name,u.avatar_url)}<span><b>${esc(u.first_name||'—')}</b>${u.verified?'<span class="tag t-ok">✓</span>':''}<br><small style="color:var(--m)">${esc(u.email||'')}${u.car_model?' · 🚗 '+esc(u.car_model):''}${u.stripe_ready?' · 💳':''}</small></span></span>
      <button class="btn small ${u.verified?'sec':''}" onclick="setVerified('${u.uid}',${!u.verified},this)">${u.verified?'Retirer':'✓ Vérifier'}</button></div>`).join(''); };
  $('#aq').oninput=draw; draw(); openAdmin._data=data; loadVerifQueue();
}
async function setVerified(id,v,btn){ btn.disabled=true; const {error}=await sb.rpc('admin_set_verified',{target:id,v}); if(error){btn.disabled=false;return toast(errMsg(error));}
  const u=(openAdmin._data||[]).find(x=>x.uid===id); if(u) u.verified=v; if(id===user.id) me.verified=v; toast(v?'Badge ✓ Vérifié attribué':'Badge retiré'); $('#aq').oninput(); }
async function logout(){await sb.auth.signOut();user=null;me=null;toast('Déconnecté');go('search');}

async function openChat(bid, other){
  sheet(`<h2>💬 ${esc(other||'Conversation')}</h2><div class="hint">Échangez ici le point de rendez-vous. Ne partagez pas d'informations sensibles.</div>
    <div class="msgs" id="msgs"><div class="hint">Chargement…</div></div>
    <div class="row"><input id="mtx" placeholder="Ton message" maxlength="1000"><button class="btn small" style="flex:none" id="msend">Envoyer</button></div>
    <button class="btn sec" onclick="closeSheet()">Fermer</button>`);
  let lastMarked='';
  const load=async()=>{const [{data},{data:readAt}]=await Promise.all([sb.from('messages').select('*').eq('booking_id',bid).order('created_at'), sb.rpc('other_read_at',{b:bid})]);
    const box=$('#msgs'); if(!box)return; const atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<40;
    const msgs=data||[]; const lastMine=[...msgs].reverse().find(m=>m.sender_id===user.id);
    const seen = lastMine && readAt && new Date(readAt)>=new Date(lastMine.created_at);
    box.innerHTML=msgs.map(m=>`<div class="msg ${m.sender_id===user.id?'me':''}">${esc(m.body)}<small>${hm(new Date(m.created_at))}${m===lastMine?(seen?' · ✓✓ Lu':' · ✓ Envoyé'):''}</small></div>`).join('')||'<div class="hint">Aucun message. Dis bonjour 👋</div>';
    if(atEnd)box.scrollTop=box.scrollHeight;
    const lastIn=[...msgs].reverse().find(m=>m.sender_id!==user.id);
    if(lastIn && lastIn.created_at>lastMarked){ lastMarked=lastIn.created_at; await sb.rpc('mark_read',{b:bid}); refreshNotif(); }};
  const send=async()=>{const body=$('#mtx').value.trim();if(!body)return;$('#mtx').value='';
    const {error}=await sb.from('messages').insert({booking_id:bid,body});if(error)return toast(errMsg(error));load();};
  $('#msend').onclick=send; $('#mtx').onkeydown=e=>{if(e.key==='Enter')send();};
  await load(); $('#msgs').scrollTop=1e6; clearInterval(chatTimer); chatTimer=setInterval(load,4000);
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
(async()=>{ if(configured){ await loadMe(); sb.auth.onAuthStateChange(async(ev)=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){ await loadMe(); refreshNotif(); } }); await handleReturn(); refreshNotif(); setInterval(()=>{ if(!document.hidden) refreshNotif(); },20000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshNotif(); }); } render(); })();
</script>
